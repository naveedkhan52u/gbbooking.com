<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | GBbooking.com</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-client.js"></script></head><body style="font-family:Inter,Arial,sans-serif;max-width:420px;margin:3rem auto;padding:1rem"><h1>Set a new password</h1><form id="reset"><label for="pw">New password</label><input id="pw" type="password" minlength="6" required style="display:block;width:100%;padding:12px;margin:8px 0 16px"><button type="submit">Update password</button></form><p id="msg" role="status"></p><script>document.getElementById('reset').addEventListener('submit',async e=>{e.preventDefault();const {error}=await gbSupabase.auth.updateUser({password:document.getElementById('pw').value});document.getElementById('msg').textContent=error?error.message:'Password updated. You can now log in.';if(!error)setTimeout(()=>location.href='/login.html',1500);});</script></body></html>

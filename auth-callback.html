<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing in | GBbooking.com</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/supabase-client.js"></script></head><body style="font-family:Inter,Arial,sans-serif;padding:2rem"><p id="message">Completing sign-in…</p><script>
(async()=>{const msg=document.getElementById('message');try{const {data,error}=await gbSupabase.auth.getSession();if(error)throw error;if(!data.session)throw new Error('No active session. Please try signing in again.');const {data:p,error:pe}=await gbSupabase.from('profiles').select('role').eq('id',data.session.user.id).maybeSingle();if(pe)throw pe;location.replace(p?.role==='provider'?'/provider-dashboard.html':p?.role==='admin'?'/admin/dashboard.html':'/dashboard.html');}catch(e){msg.textContent=e.message;}})();
</script></body></html>
